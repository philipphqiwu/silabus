services:
  db:
    image: postgres:16-alpine
    container_name: silabus-db
    environment:
      POSTGRES_USER: silabus
      POSTGRES_PASSWORD: silabus
      POSTGRES_DB: silabus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silabus -d silabus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
