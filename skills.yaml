# Skill taxonomy. `make taxonomy-sync` loads this into the skills table and sets
# taxonomy_version to the file hash. Matching is case-insensitive and an alias
# may only map to one canonical skill.
#
# This is a seed list. I will grow it to 120+ entries as I label postings.
version: 1

skills:
  - canonical: Python
    aliases: [python3, py, python 3]
  - canonical: JavaScript
    aliases: [js, ecmascript, es6, es2015]
  - canonical: TypeScript
    aliases: [ts]
  - canonical: Node.js
    aliases: [node, nodejs, node js]
